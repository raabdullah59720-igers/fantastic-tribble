services:
  - type: web
    name: terravex-voice-signaling-relay
    runtime: node
    rootDir: relay-server
    buildCommand: node --check server.js
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ROOM_TTL_SECONDS
        value: "900"
